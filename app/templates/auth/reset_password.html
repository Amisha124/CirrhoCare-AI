{% extends "base.html" %}
{% block public_content %}
<main class="flex min-h-screen items-center justify-center px-4">
  <form method="post" class="glass-card w-full max-w-md rounded-2xl p-8">
    {{ form.hidden_tag() }}
    <h1 class="mb-2 text-3xl font-black">Reset password</h1>
    <p class="mb-6 text-slate-500">Create a new password for {{ user.email }}.</p>
    <label class="mb-4 block text-sm font-bold">
      New password
      {{ form.password(class="input mt-2") }}
      {% for error in form.password.errors %}<span class="mt-1 block text-xs text-rose-600">{{ error }}</span>{% endfor %}
    </label>
    <label class="mb-6 block text-sm font-bold">
      Confirm new password
      {{ form.confirm_password(class="input mt-2") }}
      {% for error in form.confirm_password.errors %}<span class="mt-1 block text-xs text-rose-600">{{ error }}</span>{% endfor %}
    </label>
    {{ form.submit(class="btn-primary w-full") }}
  </form>
</main>
{% endblock %}
