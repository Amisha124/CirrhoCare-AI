{% extends "base.html" %}
{% set page_title = "Profile" %}
{% block content %}
<div class="glass-card max-w-xl rounded-2xl p-6">
  <h2 class="text-2xl font-black">{{ current_user.name }}</h2>
  <p class="mt-2 text-slate-500">{{ current_user.email }}</p>
  <p class="mt-4 rounded-2xl bg-lavender-100 px-4 py-3 font-bold capitalize text-purple-700">{{ current_user.role }}</p>
</div>
{% endblock %}
