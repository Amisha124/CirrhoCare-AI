<header class="mb-6 flex items-center justify-between">
  <div>
    <button class="rounded-xl bg-white px-3 py-2 shadow md:hidden" @click="sidebarOpen=true">Menu</button>
    <p class="hidden text-sm text-slate-500 md:block">Welcome back, {{ current_user.name }}</p>
    <h1 class="text-2xl font-black text-slate-900">{{ page_title or "Dashboard" }}</h1>
  </div>
  <div class="flex items-center gap-3">
    <button class="rounded-2xl border border-purple-100 bg-white px-4 py-2 text-sm font-bold shadow-sm" @click="toggleDark()">Mode</button>
    <span class="rounded-2xl bg-lavender-100 px-4 py-2 text-sm font-bold capitalize text-purple-700">{{ current_user.role }}</span>
  </div>
</header>
